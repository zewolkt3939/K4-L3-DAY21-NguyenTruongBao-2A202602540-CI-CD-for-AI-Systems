name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.dvc'
      - '.dvc/config'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'params.yaml'
      - 'requirements*.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: income-production
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --progress-bar off -r requirements.txt
      - run: python -m pytest tests/ -v

  train:
    name: Train
    environment: S3lab
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --progress-bar off -r requirements-aws.txt
      - name: Authenticate to cloud storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: python -m src.ci_credentials
      - name: Configure DVC remote
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: python -m src.configure_dvc
      - name: Pull training and holdout data
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python -m src.train
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('outputs/report.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f"f1={report['f1_score']}\n")
          PY
      - name: Save model candidate
        uses: actions/upload-artifact@v4
        with:
          name: model-candidate
          path: models/model.joblib
          if-no-files-found: error
      - name: Save training report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check positive-class F1
        env:
          MODEL_F1: ${{ needs.train.outputs.f1 }}
        run: python -m src.quality_gate

  release:
    name: Release
    environment: S3lab
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --progress-bar off -r requirements-aws.txt
      - name: Authenticate to cloud storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: python -m src.ci_credentials
      - uses: actions/download-artifact@v4
        with:
          name: model-candidate
          path: models
      - uses: actions/download-artifact@v4
        with:
          name: report
          path: outputs
      - name: Publish approved model
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python -m src.cloud_storage upload models/model.joblib "artifacts/runs/${GITHUB_RUN_ID}/model.joblib"
          python -m src.cloud_storage upload outputs/report.json "artifacts/runs/${GITHUB_RUN_ID}/report.json"
          python -m src.cloud_storage upload models/model.joblib artifacts/current/model.joblib
          python -m src.cloud_storage upload outputs/report.json artifacts/current/report.json
      - name: Copy application code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'src,requirements-serve.txt'
          target: '/home/${{ secrets.SERVER_USER }}/income-app'
      - name: Restart API and check health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd "$HOME/income-app"
            .venv/bin/python -m pip install --progress-bar off -r requirements-serve.txt
            sudo systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 3 http://127.0.0.1:8080/healthz; then
                echo 'Health check passed.'
                exit 0
              fi
              sleep 5
            done
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
